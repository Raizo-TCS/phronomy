SPECIFICATION LostReplyProgressSpec
CONSTANTS
  Profile = "lost_retry"
  TerminalKind = "completed"
  CapturedCancellation = FALSE
  AllowReads = TRUE
  AllowRetries = TRUE
  AllowInterference = FALSE
  AllowReadFailure = FALSE
  AllowRollback = FALSE
  AllowLostReply = TRUE
  ForceLostReply = TRUE
  AllowReadRecovery = FALSE
  Outermost = TRUE
  MaxRetryCalls = 1
  Bug = "none"
INVARIANTS
  TypeOK
  ObservationProofSound
  ExactPreGuard
  NoConcurrentOverwrite
  PostDoesNotWrite
  ExactRetryMaterial
  AtMostOneTerminalCommit
  RollbackPreservesDurableContent
  ReconciliationReadOnly
  NoBusinessReplay
  ProposalComputedOnce
  OnlyOuterCommitPublishes
PROPERTIES
  EventuallyRecheckedLostReply
CHECK_DEADLOCK FALSE
