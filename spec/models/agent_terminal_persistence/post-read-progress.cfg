SPECIFICATION ReadProgressSpec
CONSTANTS
  Profile = "post"
  TerminalKind = "completed"
  CapturedCancellation = FALSE
  AllowReads = TRUE
  AllowRetries = FALSE
  AllowInterference = FALSE
  AllowReadFailure = FALSE
  AllowRollback = FALSE
  AllowLostReply = FALSE
  ForceLostReply = FALSE
  AllowReadRecovery = FALSE
  Outermost = TRUE
  MaxRetryCalls = 2
  Bug = "none"
INVARIANTS
  TypeOK
  ObservationProofSound
  ExactPreGuard
  NoConcurrentOverwrite
  PostDoesNotWrite
  ExactRetryMaterial
  AtMostOneTerminalCommit
  RollbackPreservesDurableContent
  ReconciliationReadOnly
  NoBusinessReplay
  ProposalComputedOnce
  OnlyOuterCommitPublishes
PROPERTIES
  EventuallyCommitted
CHECK_DEADLOCK FALSE
