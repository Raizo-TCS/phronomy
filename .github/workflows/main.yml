name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'
          - 'head'
        include:
          - ruby: 'head'
            continue-on-error: true
    continue-on-error: ${{ matrix.ruby == 'head' }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Install dependencies
        run: bundle install --jobs 4
      - name: Run the default task
        run: bundle exec rake
      - name: Run all integration tests (stub-based, no LM Studio required)
        run: bundle exec rspec --tag integration --format progress
      - name: Benchmark smoke check
        run: bundle exec ruby benchmark/run_all.rb
        env:
          BENCHMARK_MAX_SECONDS: "60"

  deprecated-api-check:
    runs-on: ubuntu-latest
    name: Lint — deprecated API names
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check README for deprecated API names
        run: |
          banned=(ThreadActorRegistry max_actors memory_compression WindowMemory load_messages _run_in_thread_actor)
          found=0
          for pattern in "${banned[@]}"; do
            if grep -qn "$pattern" README.md; then
              echo "FAIL: deprecated name '$pattern' found in README.md:"
              grep -n "$pattern" README.md
              found=1
            fi
          done
          exit $found

  readme-syntax:
    runs-on: ubuntu-latest
    name: Lint — README Ruby syntax
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false
      - name: Syntax-check Ruby code blocks in README
        run: ruby scripts/check_readme_ruby.rb

  readme-runnable:
    runs-on: ubuntu-latest
    name: Lint — README runnable blocks
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Execute runnable README code blocks
        run: bundle exec ruby scripts/check_readme_runnable.rb

  coverage:
    runs-on: ubuntu-latest
    name: Coverage gate (line ≥ 85 %, branch ≥ 75 %)
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Run tests with coverage
        run: bundle exec rspec
        env:
          COVERAGE: "1"

  api-annotations:
    runs-on: ubuntu-latest
    name: Lint — @api annotation coverage
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false
      - name: Check @api public/@api private annotation coverage
        run: ruby scripts/check_api_annotations.rb

  private-enforcement:
    runs-on: ubuntu-latest
    name: Lint — @api private methods must not be public
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Enforce @api private visibility
        run: bundle exec ruby scripts/check_private_enforcement.rb
