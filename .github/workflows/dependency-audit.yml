name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    name: Audit the complete development bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Resolve development and runtime dependencies
        run: bundle install --jobs 4
      - name: Audit all resolved dependencies
        run: bundle exec bundler-audit check --update
