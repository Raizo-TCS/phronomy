name: Nightly — Mutation Testing

on:
  schedule:
    - cron: '0 3 * * *'   # daily at 03:00 UTC (after real-backend nightly at 02:00)
  workflow_dispatch:        # allow manual trigger

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    name: Mutation score — ${{ matrix.subject }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - subject: Phronomy::WorkflowContext
            label: WorkflowContext
          - subject: Phronomy::WorkflowRunner
            label: WorkflowRunner
            timeout_minutes: 60
          - subject: Phronomy::Tool::Base
            label: Tool::Base
          - subject: Phronomy::LlmContextWindow::TokenBudget
            label: LlmContextWindow::TokenBudget
          - subject: Phronomy::LlmContextWindow::Assembler
            label: LlmContextWindow::Assembler
          - subject: Phronomy::Agent::Context::Conversation::TrimContext
            label: Agent::Context::Conversation::TrimContext
          - subject: Phronomy::Agent::Context::Conversation::CompactionContext
            label: Agent::Context::Conversation::CompactionContext
          - subject: Phronomy::Agent::Context::Knowledge::VectorStore::InMemory
            label: Agent::Context::Knowledge::VectorStore::InMemory
          - subject: Phronomy::Concurrency::CancellationToken
            label: Concurrency::CancellationToken
          - subject: Phronomy::Agent::Concerns::ErrorTranslation
            label: ErrorTranslation
          - subject: Phronomy::Guardrail::InputGuardrail
            label: Guardrail::InputGuardrail
          - subject: Phronomy::Guardrail::OutputGuardrail
            label: Guardrail::OutputGuardrail
          - subject: Phronomy::Tracing::Base
            label: Tracing::Base
          - subject: Phronomy::Tracing::NullTracer
            label: Tracing::NullTracer
          - subject: Phronomy::Eval::Runner
            label: Eval::Runner
          - subject: Phronomy::Eval::Scorer::Base
            label: Eval::Scorer::Base
          - subject: Phronomy::Eval::Scorer::ExactMatch
            label: Eval::Scorer::ExactMatch
          - subject: Phronomy::Eval::Scorer::IncludesScorer
            label: Eval::Scorer::IncludesScorer
          - subject: Phronomy::Eval::Scorer::LlmJudge
            label: Eval::Scorer::LlmJudge

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Run mutation tests — ${{ matrix.label }}
        run: |
          bundle exec mutant run -- "${{ matrix.subject }}"
        timeout-minutes: ${{ matrix.timeout_minutes || 30 }}
