name: Nightly — Mutation Testing

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    name: Mutation score — ${{ matrix.subject }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - subject: Phronomy::WorkflowContext
            label: WorkflowContext
          - subject: Phronomy::WorkflowRunner
            label: WorkflowRunner
            timeout_minutes: 60
          - subject: Phronomy::Agent::Context::Capability::Base
            label: Tool::Base
          - subject: Phronomy::LlmContextWindow::TokenBudget
            label: LlmContextWindow::TokenBudget
          - subject: Phronomy::Agent::ContextAssembler
            label: Agent::ContextAssembler
          - subject: Phronomy::Agent::ContextPolicies::Default
            label: ContextPolicies::Default
          - subject: Phronomy::Agent::Selection::UnitBuilders::DependencyAwareUnitBuilder
            label: DependencyAwareUnitBuilder
          - subject: Phronomy::Agent::ContextParts::Requirements::RequiredContextResolver
            label: RequiredContextResolver
          - subject: Phronomy::Agent::Selection::Selectors::RecentFirstSelector
            label: RecentFirstSelector
          - subject: Phronomy::Agent::ContextParts::Budget::TokenBudgetPacker
            label: TokenBudgetPacker
          - subject: Phronomy::Agent::ContextPlanValidator
            label: ContextPlanValidator
          - subject: Phronomy::MultiAgent::HandoffPolicy
            label: MultiAgent::HandoffPolicy
          - subject: Phronomy::MultiAgent::HandoffProjection
            label: MultiAgent::HandoffProjection
          - subject: Phronomy::VectorStore::InMemory
            label: VectorStore::InMemory

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Run mutation tests — ${{ matrix.label }}
        run: |
          bundle exec mutant run -- "${{ matrix.subject }}"
        timeout-minutes: ${{ matrix.timeout_minutes || 30 }}
