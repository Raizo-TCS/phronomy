name: Nightly — Mutation Testing

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    name: Mutation score — ${{ matrix.subject }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - subject: Phronomy::WorkflowContext
            label: WorkflowContext
          - subject: Phronomy::WorkflowRunner
            label: WorkflowRunner
            timeout_minutes: 60
          - subject: Phronomy::Tool::Base
            label: Tool::Base
          - subject: Phronomy::LlmContextWindow::TokenBudget
            label: LlmContextWindow::TokenBudget
          - subject: Phronomy::Context::Assembly
            label: Context::Assembly
          - subject: Phronomy::Agent::ContextPreparation
            label: Agent::ContextPreparation
          - subject: Phronomy::Context::DefaultPolicy
            label: Context::DefaultPolicy
          - subject: Phronomy::Context::ContextPolicyInputBuilder
            label: ContextPolicyInputBuilder
          - subject: Phronomy::Context::ContextPlanValidator
            label: ContextPlanValidator
          - subject: Phronomy::MultiAgent::HandoffPolicy
            label: MultiAgent::HandoffPolicy
          - subject: Phronomy::Agent::TransferProjection
            label: Agent::TransferProjection
          - subject: Phronomy::VectorStore::InMemory
            label: VectorStore::InMemory

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Run mutation tests — ${{ matrix.label }}
        run: |
          bundle exec mutant run -- "${{ matrix.subject }}"
        timeout-minutes: ${{ matrix.timeout_minutes || 30 }}
