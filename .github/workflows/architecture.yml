name: Architecture

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'sig/**'
      - 'tools/architecture/**'
      - 'docs/architecture/**'
      - 'phronomy.gemspec'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.github/workflows/architecture.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'sig/**'
      - 'tools/architecture/**'
      - 'docs/architecture/**'
      - 'phronomy.gemspec'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.github/workflows/architecture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/architecture/tools/requirements.txt
      - name: Install Ruby AST parser
        run: python -m pip install -r tools/architecture/tools/requirements.txt
      - name: Validate RBS declarations
        run: bundle exec rbs -I sig validate
      - name: Check architecture tooling
        run: python -m unittest discover -s tools/architecture/tests -v
      - name: Check boundaries and regenerate the complete source diagram
        run: python tools/architecture/refresh_diagram.py . tmp/architecture
      - name: Upload source diagram and evidence
        uses: actions/upload-artifact@v4
        with:
          name: architecture-${{ github.sha }}
          path: tmp/architecture/
          if-no-files-found: error
          retention-days: 30
